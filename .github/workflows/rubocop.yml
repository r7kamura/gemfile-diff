name: rubocop

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  rubocop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1.336.0
        with:
          bundler-cache: true
      - run: bundle exec rubocop --parallel --format progress --format github
